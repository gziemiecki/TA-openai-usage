# TA-openai-usage macros.conf
#
# Every saved search in this add-on goes through these macros so an admin has
# one place to point them at the right index.  Edit the definition below to
# match the index configured on the input, e.g. `index=openai`.

[openai_usage_index]
definition = index=*
iseval = 0

# Successful events carry no `status` field at all; only failures set
# status=error.  `status!=error` would therefore match nothing, because a
# field comparison in SPL does not match events where the field is absent.
# `NOT status=error` is the form that keeps null-status events.
[openai_usage_ok]
definition = `openai_usage_index` sourcetype="openai:usage" NOT status=error
iseval = 0

[openai_costs_ok]
definition = `openai_usage_index` sourcetype="openai:usage" endpoint_type=costs NOT status=error
iseval = 0
