# Successful events carry no `status` field; only failures set status=error.
# `status!=error` matches nothing, because an SPL field comparison does not
# match events where the field is absent.  Use `NOT status=error`.

[openai_api_usage]
search   = sourcetype="openai:usage" NOT status=error
priority = 1

[openai_api_usage_completions]
search   = sourcetype="openai:usage" endpoint_type=completions NOT status=error
priority = 2

[openai_api_usage_embeddings]
search   = sourcetype="openai:usage" endpoint_type=embeddings NOT status=error
priority = 2

[openai_api_cost]
search   = sourcetype="openai:usage" endpoint_type=costs NOT status=error
priority = 2

[openai_api_usage_error]
search   = sourcetype="openai:usage" status=error
priority = 1
