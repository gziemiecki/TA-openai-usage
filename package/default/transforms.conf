# TA-openai-usage transforms.conf
#
# Defines the cost-enrichment lookup table that maps (model, endpoint_type)
# pairs to per-unit pricing.  Use this lookup in searches to calculate
# estimated_cost_usd for any openai:usage event.
#
# Example SPL:
#   ... | lookup openai_model_costs model endpoint_type
#         OUTPUT cost_per_input_unit_usd cost_per_output_unit_usd input_unit output_unit

[openai_model_costs]
filename      = openai_model_costs.csv
default_match = true
max_matches   = 1
