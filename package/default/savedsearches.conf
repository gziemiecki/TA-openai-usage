[OpenAI Usage - Vector Stores Daily Summary]
description   = Daily vector store storage snapshot in bytes and estimated GB-day cost
search        = index=* sourcetype="openai:usage" endpoint_type=vector_stores status!=error \
  | eval bytes_stored_gb = round(bytes_stored / 1073741824, 4) \
  | eval estimated_cost_usd = round(bytes_stored * 0.0000001, 6) \
  | timechart span=1d \
      max(bytes_stored) as peak_bytes_stored \
      max(bytes_stored_gb) as peak_gb_stored \
      sum(estimated_cost_usd) as total_estimated_cost_usd
cron_schedule           = 5 0 * * *
dispatch.earliest_time  = -1d@d
dispatch.latest_time    = @d
enableSched             = 1
is_visible              = 1
alert.track             = 0

