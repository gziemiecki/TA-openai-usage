[OpenAI Usage - Code Interpreter Daily Summary]
description   = Daily Code Interpreter session count and cost
search        = index=* sourcetype="openai:usage" endpoint_type=code_interpreter status!=error \
  | lookup openai_model_costs model AS "*" endpoint_type \
