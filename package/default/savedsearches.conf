# TA-openai-usage savedsearches.conf
#
# Two kinds of search live here.
#
#   Billed cost    reads endpoint_type=costs, which is what OpenAI actually
#                  charged, in currency, from /v1/organization/costs.  Use
#                  these for anything that reaches a finance conversation.
#
#   Estimated cost reads the usage endpoints and multiplies quantities by the
#                  openai_model_costs lookup.  That lookup is a local price
#                  list maintained by hand, so it drifts whenever OpenAI
#                  changes pricing.  Its value is the per-model breakdown,
#                  which the costs endpoint does not provide.  Treat the
#                  numbers as directional and reconcile them against billed
#                  cost using the last search in this file.
#
# All searches go through the `openai_usage_index` macro.  Point that at your
# index once in macros.conf rather than editing every search here.
#
# Searches run at 00:05 UTC daily and cover the previous calendar day.

[OpenAI Cost - Billed Daily by Line Item]
description   = Actual billed cost per day by line item, from the OpenAI costs endpoint
search        = `openai_costs_ok` \
  | timechart span=1d sum(cost_usd) as billed_cost_usd by line_item
cron_schedule           = 5 0 * * *
dispatch.earliest_time  = -1d@d
dispatch.latest_time    = @d
enableSched             = 1
is_visible              = 1
alert.track             = 0

[OpenAI Cost - Billed Daily by Project]
