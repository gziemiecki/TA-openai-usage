[OpenAI Usage - Audio Transcription Daily Summary]
description   = Daily Whisper transcription duration and cost
search        = index=* sourcetype="openai:usage" endpoint_type=audio_transcription status!=error \
  | lookup openai_model_costs model endpoint_type \
      OUTPUT input_unit cost_per_input_unit_usd \
  | eval estimated_cost_usd = round(input_seconds * cost_per_input_unit_usd, 6) \
  | eval input_minutes = round(input_seconds / 60, 2) \
  | timechart span=1d \
      sum(input_seconds) as total_input_seconds \
      sum(input_minutes) as total_input_minutes \
      sum(num_model_requests) as total_requests \
      sum(estimated_cost_usd) as total_estimated_cost_usd \
      by model
cron_schedule           = 5 0 * * *
dispatch.earliest_time  = -1d@d
dispatch.latest_time    = @d
enableSched             = 1
is_visible              = 1
alert.track             = 0

