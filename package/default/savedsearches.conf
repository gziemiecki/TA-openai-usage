# TA-openai-usage savedsearches.conf
#
# Pre-built daily summary saved searches for each endpoint_type collected
# by this add-on.  Each search enriches events with estimated cost using
# the openai_model_costs lookup and produces a one-row-per-model-per-day
# summary stored as a summary index event.
#
# These searches run at 00:05 UTC daily and cover the previous calendar day.
# Adjust cron_schedule and index values to match your environment.

[OpenAI Usage - Completions Daily Summary]
description   = Daily token and cost summary for completions (chat/text) by model
search        = index=* sourcetype="openai:usage" endpoint_type=completions status!=error \
  | lookup openai_model_costs model endpoint_type \
      OUTPUT input_unit cost_per_input_unit_usd output_unit cost_per_output_unit_usd \
  | eval estimated_cost_usd = \
      round((input_tokens * cost_per_input_unit_usd) + (output_tokens * cost_per_output_unit_usd), 6) \
  | timechart span=1d \
      sum(input_tokens) as total_input_tokens \
      sum(output_tokens) as total_output_tokens \
      sum(cached_tokens) as total_cached_tokens \
      sum(num_model_requests) as total_requests \
      sum(estimated_cost_usd) as total_estimated_cost_usd \
      by model
cron_schedule           = 5 0 * * *
dispatch.earliest_time  = -1d@d
dispatch.latest_time    = @d
enableSched             = 1
is_visible              = 1
alert.track             = 0

