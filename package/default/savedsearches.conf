[OpenAI Usage - Vector Store Storage Daily Summary]
description   = Daily peak vector store bytes stored. Storage bills per GB-day; use the billed-cost searches for the charge.
search        = `openai_usage_ok` endpoint_type=vector_stores \
  | eval gb_stored = round(bytes_stored / 1073741824, 4) \
  | timechart span=1d \
      max(bytes_stored) as peak_bytes_stored \
      max(gb_stored) as peak_gb_stored
cron_schedule           = 5 0 * * *
dispatch.earliest_time  = -1d@d
dispatch.latest_time    = @d
enableSched             = 1
is_visible              = 1
alert.track             = 0

[OpenAI Cost - Estimated vs Billed Reconciliation]
description   = Compares the local price-list estimate against what OpenAI billed. A widening gap means openai_model_costs.csv has gone stale.
search        = `openai_usage_ok` \
  | lookup openai_model_costs model endpoint_type \
      OUTPUT cost_per_input_unit_usd cost_per_output_unit_usd \
  | eval estimated_cost_usd = case( \
      endpoint_type="completions",         (input_tokens * cost_per_input_unit_usd) + (output_tokens * cost_per_output_unit_usd), \
      endpoint_type="embeddings",          input_tokens * cost_per_input_unit_usd, \
      endpoint_type="images",              num_images * cost_per_input_unit_usd, \
      endpoint_type="audio_transcription", input_seconds * cost_per_input_unit_usd, \
      endpoint_type="audio_speech",        num_characters * cost_per_input_unit_usd, \
      true(),                              null()) \
  | eval billed_cost_usd = if(endpoint_type="costs", cost_usd, null()) \
  | timechart span=1d \
      sum(estimated_cost_usd) as estimated_cost_usd \
      sum(billed_cost_usd) as billed_cost_usd \
  | eval drift_usd = round(billed_cost_usd - estimated_cost_usd, 4) \
  | eval drift_pct = if(billed_cost_usd > 0, round((drift_usd / billed_cost_usd) * 100, 2), null())
cron_schedule           = 10 0 * * *
dispatch.earliest_time  = -1d@d
dispatch.latest_time    = @d
enableSched             = 1
is_visible              = 1
alert.track             = 0
